name: Push to Main

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge main to fix
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git checkout fix
          git merge main --no-edit
          git push origin fix