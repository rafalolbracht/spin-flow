name: Pull Request CI

on:
  pull_request:
    branches:
      - develop
      - fix

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    env:
      NODE_ENV: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:unit:coverage

      - name: Upload unit test coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-unit
          path: coverage/
          retention-days: 7

  e2e-test:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: lint
    environment: ${{ github.base_ref == 'fix' && 'FIX' || 'DEV' }}
    env:
      NODE_ENV: test
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      SITE_URL: ${{ vars.SITE_URL }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      FACEBOOK_APP_ID: ${{ vars.FACEBOOK_APP_ID }}
      FACEBOOK_APP_SECRET: ${{ secrets.FACEBOOK_APP_SECRET }}
      TEST_USER_ID: ${{ vars.TEST_USER_ID }}
      TEST_USER_EMAIL: ${{ vars.TEST_USER_EMAIL }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npm run playwright:install

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload E2E test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload E2E test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Check build output
        run: |
          if [ ! -d "dist" ]; then
            echo "❌ Build failed - dist directory not found"
            exit 1
          fi
          echo "✅ Build successful - dist directory created"
          ls -la dist/

  status-comment:
    name: Post Status Comment
    runs-on: ubuntu-latest
    needs: [lint, unit-test, e2e-test, build]
    if: always()
    permissions:
      pull-requests: write
    steps:
      - name: Check job results
        id: check
        run: |
          LINT="${{ needs.lint.result }}"
          UNIT="${{ needs.unit-test.result }}"
          E2E="${{ needs.e2e-test.result }}"
          BUILD="${{ needs.build.result }}"

          echo "lint=$LINT" >> $GITHUB_OUTPUT
          echo "unit=$UNIT" >> $GITHUB_OUTPUT
          echo "e2e=$E2E" >> $GITHUB_OUTPUT
          echo "build=$BUILD" >> $GITHUB_OUTPUT

          if [ "$LINT" == "success" ] && [ "$UNIT" == "success" ] && [ "$E2E" == "success" ] && [ "$BUILD" == "success" ]; then
            echo "all_passed=true" >> $GITHUB_OUTPUT
            echo "status=✅ Wszystkie testy przeszły pomyślnie!" >> $GITHUB_OUTPUT
          else
            echo "all_passed=false" >> $GITHUB_OUTPUT
            echo "status=❌ Niektóre testy nie przeszły" >> $GITHUB_OUTPUT
          fi

      - name: Post PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pr-status
          message: |
            ## 🔍 Status Pull Request CI

            ${{ steps.check.outputs.status }}

            | Job | Status |
            |-----|--------|
            | 🔎 Lint | ${{ needs.lint.result == 'success' && '✅ Success' || '❌ Failed' }} |
            | 🧪 Unit Tests | ${{ needs.unit-test.result == 'success' && '✅ Success' || '❌ Failed' }} |
            | 🎭 E2E Tests | ${{ needs.e2e-test.result == 'success' && '✅ Success' || '❌ Failed' }} |
            | 🏗️ Build | ${{ needs.build.result == 'success' && '✅ Success' || '❌ Failed' }} |

            ---
            _Workflow run: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})_
