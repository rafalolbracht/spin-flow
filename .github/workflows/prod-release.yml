name: Production Release

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: 'Wpisz "PROD" aby potwierdzić deployment produkcyjny'
        required: true
        type: string

jobs:
  validate:
    name: Validate Production Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Validate confirmation
        run: |
          if [ "${{ github.event.inputs.confirm_production }}" != "PROD" ]; then
            echo "❌ Deployment anulowany - wymagane potwierdzenie 'PROD'"
            exit 1
          fi
          echo "✅ Potwierdzenie produkcyjne otrzymane"

      - name: Check branch
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "❌ Deployment produkcyjny możliwy tylko z brancha 'main'"
            exit 1
          fi
          echo "✅ Branch 'main' potwierdzony"

  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    if: ${{ github.ref_name == 'main' }}
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    if: ${{ github.ref_name == 'main' }}
    needs: lint
    env:
      NODE_ENV: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:unit

  build:
    name: Build Application
    runs-on: ubuntu-latest
    if: ${{ github.ref_name == 'main' }}
    needs: unit-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: dist/
          retention-days: 30

  migrate:
    name: Database Migration (PROD)
    runs-on: ubuntu-latest
    if: ${{ github.ref_name == 'main' }}
    needs: build
    environment: PROD
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN_ACCOUNT }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Supabase CLI
        run: |
          npm install -g supabase

      - name: Run database migrations
        run: |
          echo "🔄 Uruchamianie migracji produkcyjnych..."
          supabase db push --project-ref ${{ vars.SUPABASE_PROJECT_REF }}
          echo "✅ Migracje zakończone pomyślnie"

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: ${{ github.ref_name == 'main' }}
    needs: migrate
    environment: PROD
    steps:
      - name: Trigger Cloudflare Deploy Hook
        run: |
          echo "🚀 Uruchamianie deployment produkcyjny..."
          response=$(curl -X POST "${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}" \
            -H "Content-Type: application/json" \
            -w "\n%{http_code}" \
            -s)

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n-1)

          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "✅ Deployment uruchomiony pomyślnie (HTTP $http_code)"
            echo "$body"
          else
            echo "❌ Błąd podczas uruchamiania deploymentu (HTTP $http_code)"
            echo "$body"
            exit 1
          fi

      - name: Wait for deployment
        run: |
          echo "⏳ Oczekiwanie na zakończenie deploymentu..."
          sleep 60
          echo "✅ Deployment prawdopodobnie zakończony"

  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [validate, lint, unit-test, build, migrate, deploy]
    if: always()
    steps:
      - name: Check deployment status
        run: |
          if [ "${{ needs.deploy.result }}" == "success" ]; then
            echo "🎉 ✅ DEPLOYMENT PRODUKCYJNY ZAKOŃCZONY POMYŚLNIE!"
            echo ""
            echo "📋 Podsumowanie:"
            echo "  • Walidacja: ${{ needs.validate.result }}"
            echo "  • Lint: ${{ needs.lint.result }}"
            echo "  • Testy jednostkowe: ${{ needs.unit-test.result }}"
            echo "  • Build: ${{ needs.build.result }}"
            echo "  • Migracje: ${{ needs.migrate.result }}"
            echo "  • Deploy: ${{ needs.deploy.result }}"
            echo ""
            echo "🌐 Aplikacja dostępna pod: ${{ vars.SITE_URL }}"
          else
            echo "❌ DEPLOYMENT PRODUKCYJNY NIEUDANY"
            echo ""
            echo "📋 Status kroków:"
            echo "  • Walidacja: ${{ needs.validate.result }}"
            echo "  • Lint: ${{ needs.lint.result }}"
            echo "  • Testy jednostkowe: ${{ needs.unit-test.result }}"
            echo "  • Build: ${{ needs.build.result }}"
            echo "  • Migracje: ${{ needs.migrate.result }}"
            echo "  • Deploy: ${{ needs.deploy.result }}"
            exit 1
          fi
