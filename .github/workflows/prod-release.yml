name: Production Release

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: 'Wpisz "PROD" aby potwierdzić deployment produkcyjny'
        required: true
        type: string

jobs:
  validate:
    name: Validate Production Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Validate confirmation
        run: |
          if [ "${{ github.event.inputs.confirm_production }}" != "PROD" ]; then
            echo "❌ Deployment anulowany - wymagane potwierdzenie 'PROD'"
            exit 1
          fi
          echo "✅ Potwierdzenie produkcyjne otrzymane"

      - name: Check branch
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "❌ Deployment produkcyjny możliwy tylko z brancha 'main'"
            exit 1
          fi
          echo "✅ Branch 'main' potwierdzony"

  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    if: ${{ github.ref_name == 'main' }}
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run linter
        run: npm run lint

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    if: ${{ github.ref_name == 'main' }}
    needs: lint
    env:
      NODE_ENV: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run unit tests
        run: npm run test:unit

  migrate:
    name: Database Migration (PROD)
    runs-on: ubuntu-latest
    if: ${{ github.ref_name == 'main' && needs.lint.result == 'success' && needs.unit-test.result == 'success' }}
    needs: [ lint, unit-test ]
    environment: PROD
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN_ACCOUNT }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Link Supabase project
        run: |
          npx --yes supabase@latest link --project-ref ${{ vars.SUPABASE_PROJECT_REF }} --password ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Run database migrations
        run: |
          echo "🔄 Uruchamianie migracji produkcyjnych..."
          npx --yes supabase@latest db push
          echo "✅ Migracje zakończone pomyślnie"

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: ${{ github.ref_name == 'main' && needs.migrate.result == 'success' }}
    needs: migrate
    environment: PROD
    env:
      NODE_ENV: production
      SITE_URL: ${{ vars.SITE_URL }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      FACEBOOK_APP_ID: ${{ secrets.FACEBOOK_APP_ID }}
      FACEBOOK_APP_SECRET: ${{ secrets.FACEBOOK_APP_SECRET }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build application
        run: npm run build

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=spin-flow

  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [validate, lint, unit-test, migrate, deploy]
    if: always()
    steps:
      - name: Check deployment status
        run: |
          if [ "${{ needs.deploy.result }}" == "success" ]; then
            echo "🎉 ✅ DEPLOYMENT PRODUKCYJNY ZAKOŃCZONY POMYŚLNIE!"
            echo ""
            echo "📋 Podsumowanie:"
            echo "  • Walidacja: ${{ needs.validate.result }}"
            echo "  • Lint: ${{ needs.lint.result }}"
            echo "  • Testy jednostkowe: ${{ needs.unit-test.result }}"
            echo "  • Migracje: ${{ needs.migrate.result }}"
            echo "  • Deploy: ${{ needs.deploy.result }}"
            echo ""
            echo "🌐 Aplikacja dostępna pod: ${{ vars.SITE_URL }}"
          else
            echo "❌ DEPLOYMENT PRODUKCYJNY NIEUDANY"
            echo ""
            echo "📋 Status kroków:"
            echo "  • Walidacja: ${{ needs.validate.result }}"
            echo "  • Lint: ${{ needs.lint.result }}"
            echo "  • Testy jednostkowe: ${{ needs.unit-test.result }}"
            echo "  • Migracje: ${{ needs.migrate.result }}"
            echo "  • Deploy: ${{ needs.deploy.result }}"
            exit 1
          fi
